<style>
  :root{
    --bg:#fffdf8;
    --ink:#3a2f1d;
    --muted:#8a7a5c;
    --accent:#b8860b;
    --accent-2:#e6c36a;
    --ok:#2f8f5b;
    --bad:#c0392b;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#fff 0%,var(--bg) 55%,#f7edd2 100%);
    color:var(--ink);
    display:flex;justify-content:center;
    padding:24px 16px 40px;
  }
  main{width:100%;max-width:880px;display:flex;flex-direction:column;gap:20px}

  header{text-align:center}
  .gold{
    font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;
    background:linear-gradient(180deg,#f3dc93,#d4a017 50%,#a87a0c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 6px rgba(150,110,20,.25));
  }
  header h1{font-size:clamp(44px,10vw,76px);line-height:1.1}
  header p{margin-top:2px;font-size:clamp(26px,5.5vw,38px);line-height:1.2}

    box-shadow:0 18px 50px rgba(150,110,20,.30);
    container-type:inline-size;
  }
  .piece{
    position:absolute;top:0;bottom:0;
    background:
      linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%),
      linear-gradient(160deg,#f3dc93,#d4a017 55%,#a87a0c);
    border:2px solid rgba(255,255,255,.85);
    display:flex;align-items:center;justify-content:center;
    color:#fffaf0;text-shadow:0 2px 8px rgba(120,80,0,.35);
    font-family:'Playfair Display',Georgia,serif;font-weight:700;
    font-size:clamp(28px,9cqw,84px);
    transition:opacity .9s ease, transform .9s ease, filter .9s ease;
    transform-origin:center;
    user-select:none;
  }
  .piece::after{ /* pequeño "enganche" de puzzle decorativo */
    content:"";position:absolute;right:-1px;top:50%;width:14px;height:26px;
    transform:translateY(-50%);background:rgba(255,255,255,.16);
    border-radius:14px 0 0 14px;
  }
  .piece.last::after{display:none}
  .piece.open{opacity:0;transform:scale(1.06);filter:blur(6px);pointer-events:none}

  /* mensaje final (debajo de la foto) */
  .banner{
    text-align:center;
    font-size:clamp(44px,12vw,92px);line-height:1.1;
    display:none;
  }
  .banner.show{display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

  .manos{
    display:none;width:100%;border-radius:18px;
    box-shadow:0 18px 50px rgba(150,110,20,.30);
  }
  .manos.show{display:block;animation:fade 1s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ---------- Tarjeta de pregunta ---------- */
  .card{
    background:var(--card);border-radius:18px;padding:22px 20px 20px;
    box-shadow:0 8px 28px rgba(170,125,20,.14);border:1px solid #f3e7c2;
    transition:opacity .7s ease, transform .7s ease, max-height .8s ease, padding .8s ease, margin .8s ease;
    max-height:700px;overflow:hidden;
  }
  .card.done{opacity:0;transform:translateY(10px);max-height:0;padding-top:0;padding-bottom:0;margin-top:-20px;pointer-events:none}
  .progress{display:flex;gap:8px;margin-bottom:16px}
  .progress i{flex:1;height:6px;border-radius:6px;background:#f1e6c4;transition:background .4s}
  .progress i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .qnum{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .qtext{font-family:'Playfair Display',Georgia,serif;font-size:clamp(21px,4.2vw,28px);margin:6px 0 16px;line-height:1.25}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.options{grid-template-columns:1fr}}
  .opt{
    font:inherit;font-weight:500;text-align:left;cursor:pointer;
    padding:14px 16px;border-radius:12px;border:2px solid #f1e6c4;background:#fffefb;color:var(--ink);
    transition:transform .15s, border-color .2s, background .2s, box-shadow .2s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent-2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(184,134,11,.22)}
  .opt:disabled{cursor:default}
  .opt.ok{background:#e6f5ec;border-color:var(--ok);color:#1d5e3b}
  .opt.bad{background:#fdecea;border-color:var(--bad);color:#8e2a20;animation:shake .45s}
  .opt.dim{opacity:.45}
  .feedback{min-height:22px;margin-top:14px;font-size:14.5px;color:var(--muted)}
  .feedback.ok{color:var(--ok);font-weight:600}
  .feedback.bad{color:var(--bad)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  footer{text-align:center}
  footer button{background:none;border:none;color:#b3a496;font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="gold">Quien sabe más </h1>
    <p class="gold">4 preguntas rápidas</p>
  </header>

  <section class="photo" id="photo" aria-label="Foto sorpresa">

  <section class="card" id="card">
    <div class="progress" id="progress"></div>
    <div class="qnum" id="qnum"></div>
    <h2 class="qtext" id="qtext"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

  <footer><button id="reset" type="button">Reiniciar</button></footer>
</main>
<canvas id="confetti"></canvas>

<script>
/* =====================================================================
   ✏️  EDITA AQUÍ LAS PREGUNTAS
   - "q": el texto de la pregunta
   - "options": las 4 respuestas
   - "correct": posición de la correcta (0 = primera, 1 = segunda, 2 = tercera, 3 = cuarta)
   ===================================================================== */
const QUESTIONS = [
  { q: "¿En que año empezamos a salir?", options: ["2020", "2019", "2021", "2022"], correct: 0 },
  { q: "¿Dónde quedamos la primera vez?", options: ["Móstoles", "Cuenca", "Valdebernardo", "Alcorcón"], correct: 2 },
  { q: "¿Cúal ha sido nuestro destino de viaje más repetido?", options: ["Málaga", "Galicia", "Asturias", "Granada"], correct: 1 },
  { q: "¿Qué ciudad acabamos de visitar? Pista: Mira la foto", options: ["Paris", "Munich", "Oporto", "Florencia"], correct: 3 }
];

/* Mensaje de acierto / fallo (editables) */
const MSG_OK  = "¡Correcto! Se desbloquea una pieza 🧩";
const MSG_BAD = "Uy, esa no es… ¡prueba otra vez!";

/* Piezas del puzzle: [inicio %, fin %] del ancho de la foto.
   La ÚLTIMA pieza es la única que contiene al chico arrodillado
   (empieza en el 55,5 % del ancho). No muevas ese 55,5 si cambias la foto. */
const PIECES = [[0,15],[15,30],[30,55.5],[55.5,100]];

/* ===================================================================== */

const $ = id => document.getElementById(id);
const photo = $('photo'), card = $('card'), banner = $('banner'), manos = $('manos');
const optionsEl = $('options'), feedback = $('feedback');
let current = 0, locked = false, timers = [];

/* Crear piezas (cubiertas) */
const pieceEls = PIECES.map(([a,b],i) => {
  const el = document.createElement('div');
  el.className = 'piece';
  el.style.left = a + '%';
  el.style.width = (b - a + (b === 100 ? 0.5 : 0)) + '%';
  el.textContent = '?';
  if (i === PIECES.length-1) el.classList.add('last');
  photo.appendChild(el);
  return el;
});

/* Barra de progreso */
const progress = $('progress');
QUESTIONS.forEach(() => progress.appendChild(document.createElement('i')));

function showQuestion(){
  const item = QUESTIONS[current];
  $('qnum').textContent = `Pregunta ${current+1} de ${QUESTIONS.length}`;
  $('qtext').textContent = item.q;
  feedback.textContent = ''; feedback.className = 'feedback';
  optionsEl.innerHTML = '';
  item.options.forEach((text, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = text;
    b.addEventListener('click', () => answer(idx, b));
    optionsEl.appendChild(b);
  });
  [...progress.children].forEach((p,i) => p.classList.toggle('on', i < current));
  locked = false;
}

function answer(idx, btn){
  if (locked) return;
  const item = QUESTIONS[current];
  if (idx === item.correct){
    locked = true;
    btn.classList.add('ok');
    [...optionsEl.children].forEach(o => { o.disabled = true; if (o !== btn) o.classList.add('dim'); });
    feedback.textContent = MSG_OK; feedback.className = 'feedback ok';
    progress.children[current].classList.add('on');
    timers.push(setTimeout(() => {
      pieceEls[current].classList.add('open');
      current++;
      if (current < QUESTIONS.length){
        timers.push(setTimeout(showQuestion, 900));
      } else {
        finish();
      }
    }, 700));
  } else {
    btn.classList.add('bad'); btn.disabled = true;
    feedback.textContent = MSG_BAD; feedback.className = 'feedback bad';
  }
}

function finish(){
  /* el mensaje y el confeti salen al instante, debajo de la foto */
  banner.classList.add('show');
  manos.classList.add('show');
  launchConfetti();
  timers.push(setTimeout(() => card.classList.add('done'), 300));
}

function reset(){
  timers.forEach(clearTimeout); timers = [];
  stopConfetti();
  banner.classList.remove('show');
  manos.classList.remove('show');
  card.classList.remove('done');
  pieceEls.forEach(p => p.classList.remove('open'));
  current = 0; showQuestion();
}
$('reset').addEventListener('click', reset);

/* ---------------- Confeti (sin librerías) ---------------- */
const cv = $('confetti'), ctx = cv.getContext('2d');
let parts = [], raf = null, endAt = 0;
const COLORS = ['#d4a017','#e6c36a','#f3dc93','#ffd700','#fff3c4','#ffffff','#ffffff','#c9971c','#f7e7a1','#b8860b'];
function resize(){ const d = window.devicePixelRatio||1; cv.width = innerWidth*d; cv.height = innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();

function spawn(x, y, angle, speed, n){
  for (let i=0;i<n;i++){
    const a = angle + (Math.random()-.5)*0.9;
    const s = speed*(0.5+Math.random()*0.7);
    parts.push({
      x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      w:6+Math.random()*7, h:9+Math.random()*9,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*.35,
      c:COLORS[(Math.random()*COLORS.length)|0],
      round:Math.random()<.25, life:0
    });
  }
}
function launchConfetti(){
  stopConfetti();
  const W = innerWidth, H = innerHeight;
  const sp = Math.min(W,H)*0.045 + 8;
  /* cañones laterales + lluvia desde arriba */
  spawn(0, H*0.75, -Math.PI/3.1, sp*1.5, 110);
  spawn(W, H*0.75, -Math.PI+Math.PI/3.1, sp*1.5, 110);
  spawn(W/2, H*0.6, -Math.PI/2, sp*1.4, 90);
  endAt = performance.now() + 7000;
  let lastRain = 0;
  const tick = (t) => {
    if (t < endAt && t - lastRain > 90){ lastRain = t; spawn(Math.random()*W, -20, Math.PI/2, 2.2, 5); }
    if (t < 1500 + (endAt-7000) && (((t/450)|0) !== (((t-16)/450)|0))){
      spawn(0, H*0.8, -Math.PI/3, sp*1.3, 30);
      spawn(W, H*0.8, -Math.PI+Math.PI/3, sp*1.3, 30);
    }
    ctx.clearRect(0,0,W,H);
    parts = parts.filter(p => p.y < H+40);
    for (const p of parts){
      p.vy += 0.16; p.vx *= 0.992; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.scale(1, Math.abs(Math.cos(p.life*0.08+p.rot)) * .8 + .2);
      if (p.round){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,6.28); ctx.fill(); }
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if (parts.length || t < endAt) raf = requestAnimationFrame(tick); else raf = null;
  };
  raf = requestAnimationFrame(tick);
}
function stopConfetti(){ if (raf) cancelAnimationFrame(raf); raf = null; parts = []; ctx.clearRect(0,0,cv.width,cv.height); }

showQuestion();
</script>
